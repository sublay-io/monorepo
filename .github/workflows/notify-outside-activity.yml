name: Notify Discord of outside activity

# Posts a short line to the owner's Discord channel when someone other than the
# owner (or a bot) opens an issue, comments, opens a PR or starts a discussion.
# Untrusted titles are passed through env vars and jq, never into the shell, and
# mentions are disabled so an issue title can't ping the channel. Nothing is
# checked out, so pull_request_target (needed for the secret on fork PRs) is safe.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]
  discussion:
    types: [created]

permissions: {}

jobs:
  notify:
    if: github.event.sender.login != 'Tsabary' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.event.repository.name }}
          WHO: ${{ github.event.sender.login }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.discussion.title }}
          URL: ${{ github.event.comment.html_url || github.event.issue.html_url || github.event.pull_request.html_url || github.event.discussion.html_url }}
        run: |
          case "$EVENT" in
            issues) WHAT="opened an issue" ;;
            issue_comment) WHAT="commented on" ;;
            pull_request_target) WHAT="opened a PR" ;;
            discussion) WHAT="started a discussion" ;;
          esac
          jq -n --arg c "**$REPO**: $WHO $WHAT: $TITLE
          $URL" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -sS --fail -H "Content-Type: application/json" -d @- "$WEBHOOK"
