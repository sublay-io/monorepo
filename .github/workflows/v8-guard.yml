# v8 guard: fails any pull request into `main` that carries v8 work — either
# because the branch is named `v8` / `v8-<slice>`, or because its API packages
# are at 8.x. Context: plan-v8-beta.md §4.2 and §5.4 (engine root).
#
# It also runs on every push to `main`, as an alarm rather than a block: the
# owner's ruleset bypass lets direct pushes through (release-bump commits are
# pushed directly), and a check that runs after a push cannot stop it. The
# block for that path is the local .githooks/pre-push hook; this run is the
# safety net for a clone that is missing it: the check fails and marks the
# commit on `main` red. Whether anyone is emailed depends on their GitHub
# notification settings (by default, whoever pushed is notified of a failed
# run they triggered).
#
# `v8` carries the in-progress 8.x SDKs and must not merge into `main` until
# v8 graduates — `main` is what publishes the npm `latest` tag. Slice branches
# are cut from `v8` and PR back into `v8`, but GitHub defaults a new PR's base
# to `main`, so a slice opened against the wrong base is an easy mistake.
#
# No `paths:` filter, unlike the test workflows: the head branch and its
# versions are what matter, not which files changed. The job runs on every PR
# into main and passes for anything that isn't v8 work, so the check always
# reports and can be made a required status check. `edited` is included so retargeting an existing PR's
# base to main re-runs it.
#
# Why the version check as well as the name check: a slice cut from `v8` but
# named out of habit (`feat/x`) passes the name check and would carry all of
# v8 into main. The API packages are bumped to 8.0.0-beta.0 the moment `v8` is
# cut, so anything branched from it is 8.x whatever it is called. Only the PR
# head's package.json files are read — as JSON, never executed — so checking
# out a fork's head is safe. The package list mirrors API_GROUPS in
# .github/scripts/check-publish-target.mjs; they all move together, so any
# one of them would do, but all six are checked.
#
# A ruleset on `main` makes this check ("No v8 into main") required. At
# graduation, delete this file AND remove that ruleset in the same change that
# merges v8 into main — a required check whose workflow no longer exists leaves
# every PR to main waiting forever.
name: v8 guard

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  v8-guard:
    name: No v8 into main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse v8 branches targeting main
        if: github.event_name == 'pull_request'
        # Passed through env rather than interpolated into the script, so a
        # branch name can never be executed as shell.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "v8" ] || [ "${HEAD_REF#v8-}" != "$HEAD_REF" ]; then
            echo "::error::'$HEAD_REF' is a v8 branch and cannot merge into main. v8 work targets the v8 branch; v8 merges into main only at graduation (plan-v8-beta.md §4.2)."
            exit 1
          fi
          echo "'$HEAD_REF' is not a v8 branch — OK."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Refuse 8.x API packages targeting main
        shell: node {0}
        run: |
          const fs = require("fs");
          const dirs = ["core", "react-js", "react-native", "expo", "node", "js"];
          const manifests = dirs.map((d) => {
            const file = `packages/${d}/package.json`;
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (err) {
              console.log(`::error::Could not read ${file} (${err.code || err.message}). If an API package was renamed or removed, update the list in .github/workflows/v8-guard.yml and API_GROUPS in .github/scripts/check-publish-target.mjs.`);
              process.exit(1);
            }
          });
          // Fail closed: a version with no readable leading major (missing,
          // non-numeric) is refused rather than silently treated as "not 8.x".
          const unreadable = manifests.filter((p) => !/^v?\d+\./.test(String(p.version)));
          if (unreadable.length > 0) {
            const list = unreadable.map((p) => `${p.name}@${p.version}`).join(", ");
            console.log(`::error::Could not read a major version from ${list}; the v8 guard fails closed.`);
            process.exit(1);
          }
          const v8 = manifests.filter((p) => parseInt(String(p.version).replace(/^v/, ""), 10) >= 8);
          if (v8.length > 0) {
            const list = v8.map((p) => `${p.name}@${p.version}`).join(", ");
            const what = process.env.GITHUB_EVENT_NAME === "push" ? "main now has" : "This PR carries";
            console.log(`::error::${what} 8.x API packages (${list}). That is v8 work, whatever the branch is called; v8 merges into main only at graduation (plan-v8-beta.md §4.2).`);
            process.exit(1);
          }
          console.log("No 8.x API packages — OK.");
